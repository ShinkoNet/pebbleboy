<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Pebbleboy settings</title>
  <link rel="icon" type="image/png" sizes="25x25" href="pebbleboy.png">
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f7f9; color: #111827; }
    main { max-width: 620px; margin: 0 auto; padding: 18px; }
    h1 { margin: 0 0 4px; font-size: 24px; }
    h2 { font-size: 18px; }
    .hint { margin: 8px 0; color: #4b5563; font-size: 12px; line-height: 1.45; }
    label { display: block; margin: 16px 0 6px; font-size: 13px; font-weight: 650; }
    input[type="url"], input[type="text"], select {
      width: 100%; padding: 12px; border: 1px solid #c9ced6; border-radius: 7px;
      background: white; color: #111827; font: inherit;
    }
    .rom { margin: 10px 0; padding: 12px; border: 1px solid #d8dce2; border-radius: 9px; background: white; }
    .rom input + input { margin-top: 8px; }
    button, .download { padding: 12px; border: 0; border-radius: 7px; font: inherit; font-weight: 650; }
    button { width: 100%; background: #e5e7eb; color: #111827; cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    .remove { margin-top: 12px; background: transparent; color: #991b1b; padding: 6px; font-size: 13px; }
    .actions { display: flex; gap: 8px; }
    .actions button { flex: 1; }
    .slot { border-top: 1px solid #d8dce2; margin-top: 12px; padding-top: 12px; }
    .slot p { margin-top: 0; }
    .apply { margin-top: 20px; background: #111827; color: white; }
    .row { display: flex; gap: 10px; align-items: center; margin: 16px 0; }
    .row label { margin: 0; }
    [hidden] { display: none !important; }
    .download { display: block; background: #111827; color: white; text-align: center; text-decoration: none; margin: 12px 0; }
    #feedback { font-size: 13px; color: #4b5563; }
  </style>
</head>
<body>
  <main>
    <h1>Pebbleboy</h1>
    <p id="feedback" role="status" aria-live="polite"></p>
    <section id="settings-fields">
      <label>ROM library</label>
      <div id="roms"></div>
      <button type="button" id="add">+ Add ROM</button>
      <p class="hint">ROM URLs: .gb / .gbc, up to 8 MiB. Saves: .sav, up to 32 KiB.</p>
      <label for="scale">Display scale</label>
      <select id="scale">
        <option value="1x">1:1 centered</option>
        <option value="fullscreen">Fill screen</option>
        <option value="fit">Aspect fit</option>
      </select>
      <div class="row">
        <input id="audio" type="checkbox"><label for="audio">Enable speaker audio</label>
      </div>
      <div class="row">
        <input id="clear" type="checkbox"><label for="clear">Clear downloaded ROM cache</label>
      </div>
      <button type="button" class="apply" id="save">Save and launch</button>
    </section>
    <section id="export" hidden></section>
  </main>
  <script src="saves.js?v=8"></script>
</body>
</html>
